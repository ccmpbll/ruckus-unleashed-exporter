# =============================================================================
# Add this job to your prometheus.yml scrape_configs section
# =============================================================================
# This scrapes the custom Ruckus exporter (not the SNMP exporter).
# You can run both side by side if you want.
# =============================================================================

  - job_name: 'ruckus-unleashed'
    scrape_interval: 65s      # slightly longer than poll interval to avoid scraping mid-collection
    scrape_timeout: 30s
    static_configs:
      - targets:
          - ruckus-exporter:9785   # <-- adjust if not on same Docker network
        labels:
          ap_model: "R850"
